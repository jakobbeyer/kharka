version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # the ref is the Rust version of the msrv job, kept in step with rust-version in Cargo.toml
      - dependency-name: dtolnay/rust-toolchain
      # release.yml is generated by cargo-dist (`dist generate`), which moves its actions on; ci.yml by hand
      - dependency-name: actions/checkout
        update-types: [version-update:semver-major]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
