name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: The problem or the task, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What could kharka do
      description: Your idea, and anything you tried instead.
